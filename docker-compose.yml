services:
  web:
    build: .
    ports: ["8080:80"]
    depends_on: [api]
  api:
    build: ./server
    environment:
      DB_HOST: db
      DB_USER: quizly
      DB_PASSWORD: ${DB_PASSWORD:-quizly}
      DB_NAME: quizly
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: quizly
      MYSQL_USER: quizly
      MYSQL_PASSWORD: ${DB_PASSWORD:-quizly}
    volumes:
      - db_data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      retries: 20
  phpmyadmin:
    image: phpmyadmin:5
    environment: { PMA_HOST: db }
    ports: ["8081:80"]
    depends_on: [db]
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports: ["3001:3000"]
    depends_on: [prometheus]
volumes:
  db_data:
  grafana_data:
